<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>文化國中704班日常環境教育地圖</title>
  <style>
    :root {
      --pikmin-bg: #f4f8f3;
      --border-color: #2d3748;
      --girl-pink: #fce4ec;
      --girl-pink-border: #f48fb1;
      --girl-text: #ad1457;
      --boy-blue: #e1f5fe;
      --boy-blue-border: #81d4fa;
      --boy-text: #0277bd;
      --shadow: 2px 2px 0px var(--border-color);
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--pikmin-bg);
      background-image: radial-gradient(#aed581 12%, transparent 13%);
      background-size: 16px 16px;
      margin: 0;
      padding: 10px;
      color: #333;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    /* 頂部標題與認證 */
    header {
      background: #8bc34a;
      border: 2px solid var(--border-color);
      box-shadow: var(--shadow);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      margin-bottom: 12px;
      position: relative;
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 1.25rem;
      color: #fff;
      text-shadow: 1px 1px 0px var(--border-color);
    }

    .auth-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .status-text {
      font-size: 0.8rem;
      color: #2e7d32;
      background: rgba(255,255,255,0.8);
      padding: 3px 8px;
      border-radius: 10px;
    }

    .btn {
      background: #ffca28;
      border: 2px solid var(--border-color);
      box-shadow: 2px 2px 0px var(--border-color);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      width: 100%;
      max-width: 200px;
    }

    .btn:active {
      transform: translate(1px, 1px);
      box-shadow: none;
    }

    /* 通用外框區塊 */
    .section-box {
      background: #ffffff;
      border: 2px solid var(--border-color);
      box-shadow: var(--shadow);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 12px;
    }

    .section-title {
      font-weight: bold;
      font-size: 1rem;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 2px dashed #ddd;
      padding-bottom: 6px;
    }

    /* 學員板凳區 (手機友善：頂端放置方便選取) */
    .bench-area {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 200px;
      overflow-y: auto;
      padding: 6px;
      background: #fafafa;
      border: 1px dashed #ccc;
      border-radius: 8px;
    }

    .student-card {
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: bold;
      border: 2px solid;
      cursor: pointer;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 1px 1px 0px rgba(0,0,0,0.1);
      min-height: 34px;
    }

    .student-card.girl {
      background: var(--girl-pink);
      border-color: var(--girl-pink-border);
      color: var(--girl-text);
    }

    .student-card.boy {
      background: var(--boy-blue);
      border-color: var(--boy-blue-border);
      color: var(--boy-text);
    }

    .student-card.selected {
      outline: 3px solid #ff9800;
      transform: scale(1.05);
      background: #fff3e0;
    }

    /* 工作職缺清單 */
    .job-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .job-card {
      background: #fff;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      padding: 6px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 44px;
    }

    .job-card.chief {
      background: #fff9c4;
      border-color: #fbc02d;
      font-weight: bold;
    }

    .job-title {
      font-size: 0.9rem;
      outline: none;
      flex-grow: 1;
      padding-right: 6px;
    }

    .job-title[contenteditable="true"] {
      border-bottom: 1px dashed #888;
    }

    .drop-slot {
      min-width: 110px;
      min-height: 34px;
      border: 1.5px dashed #bbb;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      padding: 2px;
    }

    .drop-slot:empty::before {
      content: "點擊放入";
      font-size: 0.75rem;
      color: #aaa;
    }

    /* 飄浮皮克敏動畫 */
    .pikmin-float {
      position: fixed;
      font-size: 1.2rem;
      pointer-events: none;
      z-index: 99;
      animation: floatAround 15s infinite linear;
    }

    @keyframes floatAround {
      0% { top: 90%; left: 5%; }
      50% { top: 10%; left: 80%; }
      100% { top: 90%; left: 5%; }
    }
  </style>
</head>
<body>

  <div class="pikmin-float">🌱🔴</div>

  <header>
    <h1>🌱 文化國中704班<br>日常環境教育地圖 🌱</h1>
    <div class="auth-panel">
      <span class="status-text" id="lock-status">🔒 瀏覽模式（請先解鎖編輯）</span>
      <button class="btn" onclick="toggleEdit()">輸入編輯密碼</button>
    </div>
  </header>

  <div class="section-box">
    <div class="section-title">🪑 待分派學員區（先點學員，再點工作框）</div>
    <div class="bench-area" id="bench-area" onclick="returnToBench(event)">
      </div>
  </div>

  <div class="section-box">
    <div class="section-title" style="color: #2e7d32;">🧹 外掃區職務 (7)</div>
    <div class="job-list" id="outer-jobs"></div>
  </div>

  <div class="section-box">
    <div class="section-title" style="color: #1565c0;">🧽 內掃區職務 (18)</div>
    <div class="job-list" id="inner-jobs"></div>
  </div>

  <script>
    let isEditable = false;
    let selectedStudentEl = null;

    const outerJobData = [
      "衛生股長", "火紅開路先鋒", "深藍水溝刺客", "閃電高處特工", 
      "大力紫霸主", "飛行紙屑搜查官", "硬石破垢衝鋒隊"
    ];

    const innerJobData = [
      "保健股長", "智窗", "慧窗", "黑板", "書櫃", "陽台", "走廊", 
      "垃圾", "回收", "讀書角", "第一排", "第二排", "第三排", 
      "第四排", "第五六排", "前後左右", "洗手台", "公用餐具"
    ];

    const students = [
      { id: "01", name: "01李岱臻", gender: "girl" },
      { id: "02", name: "02林永喜", gender: "girl" },
      { id: "03", name: "03林品妍", gender: "girl" },
      { id: "04", name: "04林品璇", gender: "girl" },
      { id: "05", name: "05林妤晴", gender: "girl" },
      { id: "06", name: "06邱子芯", gender: "girl" },
      { id: "07", name: "07張采穎", gender: "girl" },
      { id: "08", name: "08張祐瑄", gender: "girl" },
      { id: "09", name: "09陳依槿", gender: "girl" },
      { id: "10", name: "10劉憶萱", gender: "girl" },
      { id: "11", name: "11賴沛金", gender: "girl" },
      { id: "12", name: "12賴苡安", gender: "girl" },
      { id: "13", name: "13謝苡柔", gender: "girl" },
      { id: "15", name: "15王辰祐", gender: "boy" },
      { id: "16", name: "16林弘鎰", gender: "boy" },
      { id: "17", name: "17林裕鈁", gender: "boy" },
      { id: "18", name: "18邱渤洲", gender: "boy" },
      { id: "19", name: "19紀杰", gender: "boy" },
      { id: "20", name: "20張承煜", gender: "boy" },
      { id: "21", name: "21陳佑睿", gender: "boy" },
      { id: "22", name: "22陳利昌", gender: "boy" },
      { id: "23", name: "23游尚睿", gender: "boy" },
      { id: "24", name: "24楊佳恩", gender: "boy" },
      { id: "25", name: "25賴誠恩", gender: "boy" },
      { id: "26", name: "26鍾牧辰", gender: "boy" }
    ];

    function init() {
      renderJobs('outer-jobs', outerJobData);
      renderJobs('inner-jobs', innerJobData);
      renderStudents();
    }

    function renderJobs(containerId, jobList) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      jobList.forEach((job, index) => {
        const isChief = index === 0;
        const card = document.createElement('div');
        card.className = `job-card ${isChief ? 'chief' : ''}`;
        card.innerHTML = `
          <span class="job-title" contenteditable="${isEditable}">${job}</span>
          <div class="drop-slot" onclick="handleSlotClick(this)"></div>
        `;
        container.appendChild(card);
      });
    }

    function renderStudents() {
      const bench = document.getElementById('bench-area');
      bench.innerHTML = '';
      students.forEach(s => {
        const card = document.createElement('div');
        card.className = `student-card ${s.gender}`;
        card.id = `student-${s.id}`;
        card.innerText = s.name;
        card.onclick = (e) => {
          e.stopPropagation();
          handleStudentClick(card);
        };
        bench.appendChild(card);
      });
    }

    function toggleEdit() {
      if (!isEditable) {
        const pwd = prompt("請輸入編輯密碼：");
        if (pwd === "envedu704") {
          isEditable = true;
          document.getElementById('lock-status').innerText = "🔓 編輯模式已解鎖（點擊可分派/編輯名稱）";
          document.querySelectorAll('.job-title').forEach(el => el.setAttribute('contenteditable', 'true'));
          alert("驗證成功！可直接點擊姓名卡片與格子進行分派。");
        } else if (pwd !== null) {
          alert("密碼錯誤！");
        }
      } else {
        isEditable = false;
        document.getElementById('lock-status').innerText = "🔒 瀏覽模式（已鎖定）";
        document.querySelectorAll('.job-title').forEach(el => el.setAttribute('contenteditable', 'false'));
        clearSelection();
      }
    }

    function handleStudentClick(cardEl) {
      if (!isEditable) return;

      // 如果點擊的是已經選中的卡片，取消選取
      if (selectedStudentEl === cardEl) {
        clearSelection();
        return;
      }

      clearSelection();
      selectedStudentEl = cardEl;
      cardEl.classList.add('selected');
    }

    function handleSlotClick(slotEl) {
      if (!isEditable) return;

      // 如果目前手頭上有選中的學生卡片
      if (selectedStudentEl) {
        // 如果該格子內已有學員，將原學員移回板凳區
        if (slotEl.children.length > 0) {
          document.getElementById('bench-area').appendChild(slotEl.children[0]);
        }
        slotEl.appendChild(selectedStudentEl);
        clearSelection();
      } 
      // 如果沒有選中學生，但點擊了已有學員的格子 -> 將該學員抽回板凳區
      else if (slotEl.children.length > 0) {
        document.getElementById('bench-area').appendChild(slotEl.children[0]);
      }
    }

    function returnToBench(e) {
      if (!isEditable || !selectedStudentEl) return;
      if (e.target.id === 'bench-area') {
        document.getElementById('bench-area').appendChild(selectedStudentEl);
        clearSelection();
      }
    }

    function clearSelection() {
      if (selectedStudentEl) {
        selectedStudentEl.classList.remove('selected');
        selectedStudentEl = null;
      }
    }

    window.onload = init;
  </script>
</body>
</html>
