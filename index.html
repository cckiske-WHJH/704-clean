<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>文化國中704班日常環境教育地圖</title>

  <!-- 引入 Firebase 雲端資料庫 SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --border-color: #2d3748;
      --girl-pink: #fce4ec;
      --girl-pink-border: #f48fb1;
      --girl-text: #ad1457;
      --boy-blue: #e1f5fe;
      --boy-blue-border: #81d4fa;
      --boy-text: #0277bd;
      --shadow: 2px 2px 0px var(--border-color);
      --leaf-1: #8bc34a;
      --leaf-2: #aed581;
      --leaf-3: #dcedc8;
      --flower: #fff59d;
    }

    * {
      box-sizing: border-box; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 6px;
      color: #333;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
      background-color: #f4f8f0;
      background-image:
        radial-gradient(circle at 10% 20%, var(--leaf-2) 0 5px, transparent 6px),
        radial-gradient(circle at 60% 10%, var(--leaf-3) 0 4px, transparent 5px),
        radial-gradient(circle at 35% 55%, var(--flower) 0 3px, transparent 4px),
        radial-gradient(circle at 85% 65%, var(--leaf-2) 0 5px, transparent 6px),
        radial-gradient(circle at 15% 85%, var(--leaf-3) 0 4px, transparent 5px);
      background-size: 90px 90px;
      background-repeat: repeat;
    }

    header {
      background: linear-gradient(180deg, var(--leaf-1), #7cb342);
      border: 2px solid var(--border-color);
      box-shadow: var(--shadow);
      border-radius: 12px;
      padding: 8px 10px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.3;
      color: #fff;
      text-shadow: 1px 1px 0px var(--border-color);
    }

    .auth-panel {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .status-text {
      font-size: 0.68rem;
      color: #2e7d32;
      background: rgba(255,255,255,0.92);
      padding: 3px 8px;
      border-radius: 10px;
      white-space: nowrap;
    }

    .btn {
      background: #ffca28;
      border: 2px solid var(--border-color);
      box-shadow: 2px 2px 0px var(--border-color);
      padding: 4px 10px;
      border-radius: 16px;
      font-weight: bold;
      font-size: 0.72rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .section-box {
      background: rgba(255,255,255,0.94);
      border: 2px solid var(--border-color);
      box-shadow: var(--shadow);
      border-radius: 12px;
      padding: 8px;
      margin-bottom: 8px;
    }

    .section-title {
      font-weight: bold;
      font-size: 0.85rem;
      margin-bottom: 6px;
      border-bottom: 2px dashed #ddd;
      padding-bottom: 4px;
    }

    /* ===== 待分派學員區 ===== */
    .bench-area {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
      gap: 4px;
      min-height: 60px;
      max-height: 220px;
      overflow-y: auto;
      padding: 6px;
      background: #fafafa;
      border: 1px dashed #ccc;
      border-radius: 8px;
    }

    .student-card {
      padding: 4px 4px;
      border-radius: 10px;
      font-size: 0.72rem;
      font-weight: bold;
      border: 2px solid;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 1px 1px 0px rgba(0,0,0,0.1);
      min-height: 30px;
    }

    .student-card.girl { background: var(--girl-pink); border-color: var(--girl-pink-border); color: var(--girl-text); }
    .student-card.boy { background: var(--boy-blue); border-color: var(--boy-blue-border); color: var(--boy-text); }
    .student-card.selected { outline: 2px solid #ff9800; transform: scale(1.06); }

    /* ===== 通用地圖卡片 ===== */
    .map-card {
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-height: 56px;
      min-width: 0;
      background: #f1f8e9;
    }

    .map-title {
      font-weight: bold;
      font-size: 0.66rem;
      text-align: center;
      outline: none;
      overflow-wrap: break-word;
      line-height: 1.15;
    }

    .map-title[contenteditable="true"] {
      border-bottom: 1px dashed rgba(0,0,0,0.4);
    }

    .map-slot {
      flex: 1;
      min-height: 30px;
      border: 1.5px dashed rgba(0,0,0,0.35);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.55);
    }

    .map-slot .student-card {
      width: 100%;
      min-height: 26px;
      font-size: 0.68rem;
    }

    /* ===== 外掃區：衛生股長一列 + 其餘6員分2列(每列3格) ===== */
    #outer-jobs { display: flex; flex-direction: column; gap: 6px; }
    .outer-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .outer-row.chief-row { grid-template-columns: 1fr; }
    #outer-jobs .map-card { background: linear-gradient(#eef7e6, #dcedc8); }
    #outer-jobs .map-card.chief { background: #fff9c4; border-color: #fbc02d; }

    /* ===== 704 教室俯視圖：固定四區（A/B/C/D） ===== */
    .zone { margin-bottom: 6px; }
    .zone:last-child { margin-bottom: 0; }
    .zone-label {
      display: inline-block;
      font-weight: bold;
      font-size: 0.7rem;
      background: var(--leaf-1);
      color: #fff;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: 1px 8px;
      margin-bottom: 4px;
    }
    .zone-row {
      display: grid;
      gap: 6px;
    }
    .zone-row.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .zone-row.cols-5 { grid-template-columns: repeat(5, 1fr); }

    .zone-b .map-card[data-title="黑板"] { background: #424242; }
    .zone-b .map-card[data-title="黑板"] .map-title { color: #fff; }
    .zone-a .map-card[data-title="保健股長"] { background: #fff9c4; border-color: #fbc02d; }
    .zone-a .map-card[data-title="智窗"], .zone-a .map-card[data-title="慧窗"] { background: #bbdefb; }
    .zone-b .map-card[data-title="給呂賽鴿"] { background: #c8e6c9; }
    .zone-b .map-card[data-title="給愛麗絲"] { background: #d7ccc8; }
    .zone-d .map-card[data-title="陽台"] { background: #c8e6c9; }
    .zone-d .map-card[data-title="洗手台"] { background: #b2ebf2; }
    .zone-d .map-card[data-title="公用餐具"] { background: #ffe0b2; }
  </style>
</head>
<body>

  <header>
    <h1>🌱 文化國中704班<br>日常環境教育地圖 🌱</h1>
    <div class="auth-panel">
      <span class="status-text" id="lock-status">🔒 瀏覽模式（實時同步中）</span>
      <button class="btn" onclick="toggleEdit()">輸入編輯密碼</button>
    </div>
  </header>

  <div class="section-box">
    <div class="section-title">🪑 待分派學員區</div>
    <div class="bench-area" id="bench-area" onclick="returnToBench()"></div>
  </div>

  <div class="section-box">
    <div class="section-title">🌲 環境教育704外掃區</div>
    <div id="outer-jobs"></div>
  </div>

  <div class="section-box">
    <div class="section-title">🏫 教室內掃區 </div>
    <div id="inner-jobs"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBJ7DK4Au39FLPXw71gy4qBif0VanXVuOE",
      authDomain: "clean-e6b15.firebaseapp.com",
      databaseURL: "https://clean-e6b15-default-rtdb.firebaseio.com",
      projectId: "clean-e6b15",
      storageBucket: "clean-e6b15.firebasestorage.app",
      messagingSenderId: "47794298923",
      appId: "1:47794298923:web:5f89a558bb93b12ab60abe"
    };

    // 初始化 Firebase
    let dbRef = null;
    try {
      firebase.initializeApp(firebaseConfig);
      dbRef = firebase.database().ref('704_env_map');
    } catch (e) {
      console.log("Firebase 尚未正確設定連線");
    }

    let isEditable = false;
    let selectedStudentEl = null;

    const defaultStudents = [
      { id: "01", name: "01李岱臻", gender: "girl" },
      { id: "02", name: "02林永喜", gender: "girl" },
      { id: "03", name: "03林品妍", gender: "girl" },
      { id: "04", name: "04林品璇", gender: "girl" },
      { id: "05", name: "05林妤晴", gender: "girl" },
      { id: "06", name: "06邱子芯", gender: "girl" },
      { id: "07", name: "07張采穎", gender: "girl" },
      { id: "08", name: "08張祐瑄", gender: "girl" },
      { id: "09", name: "09陳依槿", gender: "girl" },
      { id: "10", name: "10劉憶萱", gender: "girl" },
      { id: "11", name: "11賴沛金", gender: "girl" },
      { id: "12", name: "12賴苡安", gender: "girl" },
      { id: "13", name: "13謝苡柔", gender: "girl" },
      { id: "15", name: "15王辰祐", gender: "boy" },
      { id: "16", name: "16林弘鎰", gender: "boy" },
      { id: "17", name: "17林裕鈁", gender: "boy" },
      { id: "18", name: "18邱渤洲", gender: "boy" },
      { id: "19", name: "19紀杰", gender: "boy" },
      { id: "20", name: "20張承煜", gender: "boy" },
      { id: "21", name: "21陳佑睿", gender: "boy" },
      { id: "22", name: "22陳利昌", gender: "boy" },
      { id: "23", name: "23游尚睿", gender: "boy" },
      { id: "24", name: "24楊佳恩", gender: "boy" },
      { id: "25", name: "25賴誠恩", gender: "boy" },
      { id: "26", name: "26鍾牧辰", gender: "boy" }
    ];

    // 外掃區：第一列為衛生股長（獨立一整列），其餘6員分成2列，每列3格
    const defaultOuterJobs = [
      { title: "衛生股長", chief: true },
      { title: "🏪 FamilyMart" },
      { title: "🚶 人行道" },
      { title: "🍄 你家側" },
      { title: "🌳 大家側" },
      { title: "🚲 腳踏車棚" },
      { title: "🧹 落葉清理區" }
    ];

    // 教室內掃職務：固定四區 A/B/C/D，各區由左至右排列
    const innerZones = [
      { key: "a", label: "A區", jobs: ["智窗", "保健股長", "慧窗"] },
      { key: "b", label: "B區", jobs: ["書櫃", "黑板", "讀書角", "給呂賽鴿", "給愛麗絲"] },
      { key: "c", label: "C區", jobs: ["第五六排", "第四排", "第三排", "第二排", "第一排"] },
      { key: "d", label: "D區", jobs: ["走廊", "公用餐具", "前後左右", "陽台", "洗手台"] }
    ];
    // 攤平成一維陣列，用於索引存取（idx 對應各職務在雲端資料中的位置）
    const defaultInnerJobs = innerZones.flatMap(z => z.jobs.map(title => ({ title, zone: z.key })));

    // 頁面初始化
    function init() {
      renderBaseStructure();
      if (dbRef) {
        // 監聽雲端資料庫變更（全體即時同步）
        dbRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            applyCloudData(data);
          } else {
            // 資料庫若為空，寫入預設值
            saveToCloud();
          }
        });
      }
    }

    function renderBaseStructure() {
      renderOuterJobs();
      renderInnerJobs();

      const bench = document.getElementById('bench-area');
      bench.innerHTML = '';
      defaultStudents.forEach(s => {
        const card = document.createElement('div');
        card.className = `student-card ${s.gender}`;
        card.id = `student-${s.id}`;
        card.innerText = s.name;
        card.onclick = (e) => { e.stopPropagation(); handleStudentClick(card); };
        bench.appendChild(card);
      });
    }

    function makeMapCard(idx, prefix, title, extraClass) {
      const card = document.createElement('div');
      card.className = `map-card ${extraClass || ''}`;
      card.setAttribute('data-title', title);
      card.innerHTML = `
        <div class="map-title" id="title-${prefix}-${idx}" contenteditable="${isEditable}" onblur="saveToCloud()">${title}</div>
        <div class="map-slot" id="slot-${prefix}-${idx}" onclick="handleSlotClick(this)"></div>
      `;
      return card;
    }

    // 外掃區：第0筆(衛生股長)獨立一列，其餘6筆每3筆一列
    function renderOuterJobs() {
      const container = document.getElementById('outer-jobs');
      container.innerHTML = '';

      const chiefRow = document.createElement('div');
      chiefRow.className = 'outer-row chief-row';
      chiefRow.appendChild(makeMapCard(0, 'outer', defaultOuterJobs[0].title, 'chief'));
      container.appendChild(chiefRow);

      const rest = defaultOuterJobs.slice(1); // 6 筆
      for (let r = 0; r < rest.length; r += 3) {
        const row = document.createElement('div');
        row.className = 'outer-row';
        rest.slice(r, r + 3).forEach((job, i) => {
          row.appendChild(makeMapCard(r + i + 1, 'outer', job.title, ''));
        });
        container.appendChild(row);
      }
    }

    // 教室內掃：依 A/B/C/D 四區個別成列，每區由左至右排列
    function renderInnerJobs() {
      const container = document.getElementById('inner-jobs');
      container.innerHTML = '';
      let globalIdx = 0;

      innerZones.forEach(zone => {
        const zoneEl = document.createElement('div');
        zoneEl.className = `zone zone-${zone.key}`;

        const labelEl = document.createElement('div');
        labelEl.className = 'zone-label';
        labelEl.innerText = zone.label;
        zoneEl.appendChild(labelEl);

        const rowEl = document.createElement('div');
        rowEl.className = `zone-row cols-${zone.jobs.length}`;

        zone.jobs.forEach(title => {
          rowEl.appendChild(makeMapCard(globalIdx, 'inner', title, ''));
          globalIdx++;
        });

        zoneEl.appendChild(rowEl);
        container.appendChild(zoneEl);
      });
    }

    // 將資料儲存至 Firebase 雲端
    function saveToCloud() {
      if (!dbRef || !isEditable) return;

      const state = {
        outerTitles: [],
        innerTitles: [],
        assignments: {} // slotId: studentId
      };

      defaultOuterJobs.forEach((_, idx) => {
        state.outerTitles.push(document.getElementById(`title-outer-${idx}`).innerText);
        const slot = document.getElementById(`slot-outer-${idx}`);
        if (slot.children.length > 0) state.assignments[`slot-outer-${idx}`] = slot.children[0].id;
      });

      defaultInnerJobs.forEach((_, idx) => {
        state.innerTitles.push(document.getElementById(`title-inner-${idx}`).innerText);
        const slot = document.getElementById(`slot-inner-${idx}`);
        if (slot.children.length > 0) state.assignments[`slot-inner-${idx}`] = slot.children[0].id;
      });

      dbRef.set(state);
    }

    // 讀取並渲染雲端最新資料
    function applyCloudData(data) {
      // 1. 更新職稱
      if (data.outerTitles) {
        data.outerTitles.forEach((title, idx) => {
          const el = document.getElementById(`title-outer-${idx}`);
          if (el && el !== document.activeElement) el.innerText = title;
        });
      }
      if (data.innerTitles) {
        data.innerTitles.forEach((title, idx) => {
          const el = document.getElementById(`title-inner-${idx}`);
          if (el && el !== document.activeElement) el.innerText = title;
        });
      }

      // 2. 重置所有學員回板凳區
      const bench = document.getElementById('bench-area');
      defaultStudents.forEach(s => {
        const studentEl = document.getElementById(`student-${s.id}`);
        if (studentEl) bench.appendChild(studentEl);
      });

      // 3. 根據雲端分派學員至對應位置
      if (data.assignments) {
        Object.keys(data.assignments).forEach(slotId => {
          const slot = document.getElementById(slotId);
          const studentEl = document.getElementById(data.assignments[slotId]);
          if (slot && studentEl) {
            slot.appendChild(studentEl);
          }
        });
      }
    }

    // 解鎖密碼機制
    function toggleEdit() {
      if (!isEditable) {
        const pwd = prompt("請輸入編輯密碼：");
        if (pwd === "clean183") {
          isEditable = true;
          document.getElementById('lock-status').innerText = "🔓 編輯模式已解鎖（變更將實時同步至所有人）";
          document.querySelectorAll('.map-title').forEach(el => el.setAttribute('contenteditable', 'true'));
          alert("驗證成功！點擊學員與格子即可進行排班作業。");
        } else if (pwd !== null) {
          alert("密碼是班導的身高！");
        }
      } else {
        isEditable = false;
        document.getElementById('lock-status').innerText = "🔒 瀏覽模式（實時同步中）";
        document.querySelectorAll('.map-title').forEach(el => el.setAttribute('contenteditable', 'false'));
        clearSelection();
      }
    }

    function handleStudentClick(cardEl) {
      if (!isEditable) return;
      if (selectedStudentEl === cardEl) { clearSelection(); return; }
      clearSelection();
      selectedStudentEl = cardEl;
      cardEl.classList.add('selected');
    }

    function handleSlotClick(slotEl) {
      if (!isEditable) return;
      if (selectedStudentEl) {
        if (slotEl.children.length > 0) document.getElementById('bench-area').appendChild(slotEl.children[0]);
        slotEl.appendChild(selectedStudentEl);
        clearSelection();
        saveToCloud();
      } else if (slotEl.children.length > 0) {
        document.getElementById('bench-area').appendChild(slotEl.children[0]);
        saveToCloud();
      }
    }

    function returnToBench() {
      if (!isEditable || !selectedStudentEl) return;
      document.getElementById('bench-area').appendChild(selectedStudentEl);
      clearSelection();
      saveToCloud();
    }

    function clearSelection() {
      if (selectedStudentEl) {
        selectedStudentEl.classList.remove('selected');
        selectedStudentEl = null;
      }
    }

    window.onload = init;
  </script>
</body>
</html>
